name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    name: pytest (Python ${{ matrix.python-version }})

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: requirements.txt

    # manimpango has no wheel for every Python version, so pip may build it
    # from source against pango and cairo.
    - name: Install system packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libpango1.0-dev libcairo2-dev pkg-config

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest

    # manimlib parses sys.argv when imported, so pytest is run without flags.
    # It collects tests/test_*.py; the other scripts in tests/ are render
    # harnesses that need a GPU or a display and are run by hand.
    - name: Run tests
      run: python -m pytest tests
